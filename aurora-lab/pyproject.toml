[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-lab"
version = "0.1.0"
description = "Isolated synthetic corporate-agent behavioral laboratory"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aurora-lab = "aurora.cli:main"

[tool.setuptools.packages.find]
include = ["aurora*", "prompts*"]

[tool.setuptools.package-data]
prompts = ["aurora-system.md"]
