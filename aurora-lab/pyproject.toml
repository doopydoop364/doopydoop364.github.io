[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-lab"
version = "0.1.0"
description = "Isolated synthetic corporate-agent behavioral laboratory"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["selenium>=4.30"]
test = ["pytest>=8"]

[project.scripts]
aurora-lab = "aurora.cli:main"

[tool.setuptools.packages.find]
include = ["aurora*", "prompts*"]

[tool.setuptools.package-data]
aurora = ["dashboard_page.html"]
prompts = ["aurora-system.md"]
