name: Mirror PrivaNet crawler status

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-privanet-status
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch PrivaNet crawler status
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_URL="https://privanet.pcenthusiast.blog/crawling/api/status"
          mkdir -p privanet/crawling/history

          tmp="$(mktemp)"
          headers="$(mktemp)"

          status="$({ curl \
            --silent \
            --show-error \
            --location \
            --compressed \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 60 \
            --dump-header "$headers" \
            --output "$tmp" \
            --write-out '%{http_code}' \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -H 'Referer: https://privanet.pcenthusiast.blog/crawling' \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36' \
            "$SOURCE_URL"; } 2>&1)" || {
              echo "curl itself failed"
              cat "$headers" || true
              exit 1
            }

          if [[ "$status" != "200" ]]; then
            echo "PrivaNet status endpoint returned HTTP $status"
            echo '--- response headers ---'
            cat "$headers" || true
            echo '--- response body (first 4000 bytes) ---'
            head -c 4000 "$tmp" || true
            echo
            exit 1
          fi

          python3 - "$tmp" <<'PY'
          import json
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          payload = json.loads(source.read_text(encoding="utf-8"))
          rendered = json.dumps(payload, indent=2, sort_keys=True) + "\n"
          pathlib.Path("privanet/crawling/status.json").write_text(rendered, encoding="utf-8")
          pathlib.Path("privanet/crawling/history/latest.json").write_text(rendered, encoding="utf-8")
          PY

          day="$(date -u +%F)"
          cp privanet/crawling/status.json "privanet/crawling/history/${day}.json"

      - name: Commit updated snapshot
        shell: bash
        run: |
          set -euo pipefail

          git add privanet/crawling/status.json privanet/crawling/history/

          if git diff --cached --quiet; then
            echo "No status changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: mirror PrivaNet crawler status"
          git push
