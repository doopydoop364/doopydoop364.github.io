name: Publish PrivaNet Chat Admin v0.2.0

on:
  push:
    branches: [main]
    paths:
      - ".privanet-upload/v0.2.0/READY"

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Trigger PrivaNet Chat Admin v0.2.0 publish'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .privanet-upload/v0.2.0/chunk-{0,1,2,3,4}.b64 \
            | base64 --decode \
            > privanet-chat-admin-v0.2.0.zip

          echo "76d93ba7fa228f94579bc4806ea67f400e59e568f18bbb1eb7de8c015db411a8  privanet-chat-admin-v0.2.0.zip" \
            | sha256sum --check -

          unzip -t privanet-chat-admin-v0.2.0.zip >/dev/null

          cat > privanet-chat-admin-latest.json <<'JSON'
          {
            "version": "0.2.0",
            "url": "https://doopydoop364.github.io/privanet-chat-admin-v0.2.0.zip",
            "sha256": "76d93ba7fa228f94579bc4806ea67f400e59e568f18bbb1eb7de8c015db411a8"
          }
          JSON

      - name: Publish verified archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add privanet-chat-admin-v0.2.0.zip privanet-chat-admin-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish PrivaNet Chat Admin v0.2.0"
          git push
