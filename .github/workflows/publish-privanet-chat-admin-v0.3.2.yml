name: Publish PrivaNet Chat Admin v0.3.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-privanet-chat-admin-v0.3.2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct and verify release
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .privanet-upload/v0.3.2/chunk-00.b64 \
            .privanet-upload/v0.3.2/chunk-01.b64 \
            .privanet-upload/v0.3.2/chunk-02a.b64 \
            .privanet-upload/v0.3.2/chunk-02b.b64 \
            .privanet-upload/v0.3.2/chunk-02c.b64 \
            .privanet-upload/v0.3.2/chunk-03.b64 \
            .privanet-upload/v0.3.2/chunk-04.b64 \
            .privanet-upload/v0.3.2/chunk-05a.b64 \
            .privanet-upload/v0.3.2/chunk-05b.b64 \
            .privanet-upload/v0.3.2/chunk-05c.b64 \
            .privanet-upload/v0.3.2/chunk-06a.b64 \
            .privanet-upload/v0.3.2/chunk-06b.b64 \
            .privanet-upload/v0.3.2/chunk-06c.b64 \
            .privanet-upload/v0.3.2/chunk-07a.b64 \
            .privanet-upload/v0.3.2/chunk-07b.b64 \
            .privanet-upload/v0.3.2/chunk-07c.b64 \
            | base64 -d > privanet-chat-admin-v0.3.2.zip
          echo '662142dd396641ad5e20ff3ea3fb8bc5858264f39f4a3bc3a3d03fc7b58eb252  privanet-chat-admin-v0.3.2.zip' | sha256sum -c -
          test "$(stat -c %s privanet-chat-admin-v0.3.2.zip)" = "53343"
          unzip -t privanet-chat-admin-v0.3.2.zip
          cat > privanet-chat-admin-latest.json <<'JSON'
          {
            "version": "0.3.2",
            "url": "https://doopydoop364.github.io/privanet-chat-admin-v0.3.2.zip",
            "sha256": "662142dd396641ad5e20ff3ea3fb8bc5858264f39f4a3bc3a3d03fc7b58eb252"
          }
          JSON
      - name: Publish and clean staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add privanet-chat-admin-v0.3.2.zip privanet-chat-admin-latest.json
          git rm -r .privanet-upload/v0.3.2
          git rm .github/workflows/publish-privanet-chat-admin-v0.3.2.yml
          git commit -m 'Publish PrivaNet Chat Admin v0.3.2'
          git push
