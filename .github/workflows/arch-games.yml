name: Arch Games
on:
  push:
    paths: ['arch86/games/**', '.github/workflows/arch-games.yml']
  pull_request:
    paths: ['arch86/games/**', '.github/workflows/arch-games.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    defaults:
      run:
        working-directory: arch86/games
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -c "import ctypes.util; assert ctypes.util.find_library('archive'), 'Runner requires libarchive'"
      - run: python -m pip install ruff==0.14.1
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q arch_games tests install_app.py
      - run: sh -n install.sh uninstall.sh
