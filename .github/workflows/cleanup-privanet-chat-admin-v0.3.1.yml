name: Clean up PrivaNet Chat Admin v0.3.1 publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-privanet-chat-admin-v0.3.1.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Remove temporary publisher workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/publish-privanet-chat-admin-v0.3.1.yml \
            .github/workflows/cleanup-privanet-chat-admin-v0.3.1.yml
          git commit -m 'Clean up PrivaNet Chat Admin v0.3.1 publishing workflows'
          git push
