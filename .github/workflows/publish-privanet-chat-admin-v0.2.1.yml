name: Publish PrivaNet Chat Admin v0.2.1

on:
  push:
    branches: [main]
    paths:
      - '.privanet-upload/v0.2.1/**'
      - '.github/workflows/publish-privanet-chat-admin-v0.2.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .privanet-upload/v0.2.1/chunk-*.b64 | base64 -d > privanet-chat-admin-v0.2.1.zip
          echo '83f073ce5c4f41027451e52a0d89feca0c5763f42b7670dfa5f02e1d18989b9a  privanet-chat-admin-v0.2.1.zip' | sha256sum -c -
          unzip -t privanet-chat-admin-v0.2.1.zip
          cat > privanet-chat-admin-latest.json <<'JSON'
          {
            "version": "0.2.1",
            "url": "https://doopydoop364.github.io/privanet-chat-admin-v0.2.1.zip",
            "sha256": "83f073ce5c4f41027451e52a0d89feca0c5763f42b7670dfa5f02e1d18989b9a"
          }
          JSON
      - name: Publish verified archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add privanet-chat-admin-v0.2.1.zip privanet-chat-admin-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish PrivaNet Chat Admin v0.2.1'
          git push
