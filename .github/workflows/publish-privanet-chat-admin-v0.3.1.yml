name: Publish PrivaNet Chat Admin v0.3.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-privanet-chat-admin-v0.3.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          : > archive.b64
          for sha in \
            c589a39f7fde00d96fc6fde9290d6dd26fbfd7a2 \
            b15d43e267aabad27dba67ab0fe2ce8c01fdc306 \
            679eeca76107ae0eee4e88bae9064368a3e0a7a1 \
            f69f0022c2a716e1993a1e78aac3c677bcbacacc \
            fe96873f449403e54c321570d3e2d29ba7cdf938 \
            ec25cdda7c5f9afddfa2eb9b63f5c34a9e6bcfda \
            2712847046872e6504825516ba116797417d43bb \
            c86e846d464a096b1dfb004c7625ae5562fdce5e \
            3e0878ac13fb09ffc823cc16c97ade761332cb42 \
            f8ce1e34a2c0f97fb0b8cc96b2f797ef8be9d364
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq '.content' \
              | tr -d '\n' \
              | base64 -d >> archive.b64
          done
          base64 -d archive.b64 > privanet-chat-admin-v0.3.1.zip
          echo '58da7cf06934ca3ed315986f13724eaa11f5add0dc6a1e53b24f9335a6d7a208  privanet-chat-admin-v0.3.1.zip' | sha256sum -c -
          unzip -t privanet-chat-admin-v0.3.1.zip
          cat > privanet-chat-admin-latest.json <<'JSON'
          {
            "version": "0.3.1",
            "url": "https://doopydoop364.github.io/privanet-chat-admin-v0.3.1.zip",
            "sha256": "58da7cf06934ca3ed315986f13724eaa11f5add0dc6a1e53b24f9335a6d7a208"
          }
          JSON
      - name: Publish verified archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add privanet-chat-admin-v0.3.1.zip privanet-chat-admin-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish PrivaNet Chat Admin v0.3.1'
          git push
