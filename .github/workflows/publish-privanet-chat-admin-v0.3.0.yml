name: Publish PrivaNet Chat Admin v0.3.0

on:
  push:
    branches: [main]
    paths:
      - '.privanet-upload/v0.3.0/**'
      - '.github/workflows/publish-privanet-chat-admin-v0.3.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .privanet-upload/v0.3.0/chunk-*.b64 | base64 -d > privanet-chat-admin-v0.3.0.zip
          echo '374e8d1a1393f2a2a6e2b7919b0929be37ddc6a98a0620594f2e73bb7129c9a3  privanet-chat-admin-v0.3.0.zip' | sha256sum -c -
          unzip -t privanet-chat-admin-v0.3.0.zip
          cat > privanet-chat-admin-latest.json <<'JSON'
          {
            "version": "0.3.0",
            "url": "https://doopydoop364.github.io/privanet-chat-admin-v0.3.0.zip",
            "sha256": "374e8d1a1393f2a2a6e2b7919b0929be37ddc6a98a0620594f2e73bb7129c9a3"
          }
          JSON
      - name: Publish verified archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add privanet-chat-admin-v0.3.0.zip privanet-chat-admin-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish PrivaNet Chat Admin v0.3.0'
          git push
