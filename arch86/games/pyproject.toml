[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-games"
version = "3.0.0"
description = "A local-first Arch Linux game manager: library, Wine, installs, audio and optional web GUI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
arch-games = "arch_games.cli:main"
arch86-games = "arch_games.cli:main"
arch64-games = "arch_games.cli:main"

[tool.setuptools.packages.find]
include = ["arch_games*"]

[tool.setuptools.package-data]
arch_games = ["catalog.txt", "remote/static/*", "ui/web/static/*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
